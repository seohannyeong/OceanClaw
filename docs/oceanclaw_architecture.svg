<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 34px "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; fill: #123047; }
      .subtitle { font: 400 18px "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; fill: #516375; }
      .box-title { font: 700 20px "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; fill: #12263a; }
      .box-text { font: 400 15px "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; fill: #405365; }
      .small { font: 400 13px "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; fill: #587083; }
      .label { font: 700 15px "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; fill: #1f445f; }
      .panel { fill: #ffffff; stroke: #c8d7e4; stroke-width: 2; rx: 18; }
      .blue { fill: #e8f3ff; stroke: #3b82c4; }
      .green { fill: #e9f8f0; stroke: #2e9d65; }
      .orange { fill: #fff2df; stroke: #e18b28; }
      .purple { fill: #f2edff; stroke: #7d62c9; }
      .gray { fill: #f0f4f8; stroke: #7c8fa2; }
      .dark { fill: #123047; }
      .arrow { stroke: #335f7a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #7a95aa; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow-soft); }
      .section-label { font: 700 17px "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; fill: #17324d; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#335f7a"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7a95aa"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="980"/>

  <text class="title" x="700" y="58" text-anchor="middle">OceanClaw 작품 구성도</text>
  <text class="subtitle" x="700" y="90" text-anchor="middle">선박 정비 매뉴얼 · 센서 이벤트 · Obsidian Wiki 기반 로컬 RAG AI Agent</text>

  <!-- Main service panel -->
  <rect class="panel" x="70" y="125" width="1260" height="615"/>
  <text class="section-label" x="100" y="160">서비스 흐름</text>

  <!-- User input -->
  <rect class="blue" x="115" y="195" width="230" height="96" rx="14" stroke-width="2"/>
  <text class="box-title" x="230" y="232" text-anchor="middle">정비 담당자 / 팀원</text>
  <text class="box-text" x="230" y="260" text-anchor="middle">자연어 질문 입력</text>
  <text class="small" x="230" y="281" text-anchor="middle">예: 엔진 오일 점검 방법</text>

  <rect class="gray" x="415" y="195" width="230" height="96" rx="14" stroke-width="2"/>
  <text class="box-title" x="530" y="232" text-anchor="middle">FastAPI / CLI</text>
  <text class="box-text" x="530" y="260" text-anchor="middle">질문 접수</text>
  <text class="small" x="530" y="281" text-anchor="middle">향후 Mattermost 연동</text>

  <rect class="orange" x="715" y="195" width="230" height="96" rx="14" stroke-width="2"/>
  <text class="box-title" x="830" y="232" text-anchor="middle">Query Expansion</text>
  <text class="box-text" x="830" y="260" text-anchor="middle">한국어 질문 보완</text>
  <text class="small" x="830" y="281" text-anchor="middle">영어 정비 키워드 추가</text>

  <rect class="purple" x="1015" y="195" width="230" height="96" rx="14" stroke-width="2"/>
  <text class="box-title" x="1130" y="232" text-anchor="middle">검색 대상 선택</text>
  <text class="box-text" x="1130" y="260" text-anchor="middle">Manual / Sensor / Wiki</text>
  <text class="small" x="1130" y="281" text-anchor="middle">route 옵션 또는 통합 검색</text>

  <path class="arrow" d="M345 243 L405 243"/>
  <path class="arrow" d="M645 243 L705 243"/>
  <path class="arrow" d="M945 243 L1005 243"/>

  <!-- Retrieval layer -->
  <text class="label" x="700" y="340" text-anchor="middle">Retrieval Layer</text>

  <rect class="blue" x="130" y="370" width="310" height="145" rx="14" stroke-width="2"/>
  <text class="box-title" x="285" y="407" text-anchor="middle">Manual Search</text>
  <text class="box-text" x="285" y="437" text-anchor="middle">선박 매뉴얼 PDF</text>
  <text class="small" x="285" y="462" text-anchor="middle">PDF 추출 → Chunk → Embedding</text>
  <text class="small" x="285" y="486" text-anchor="middle">Manual FAISS Index</text>

  <rect class="green" x="545" y="370" width="310" height="145" rx="14" stroke-width="2"/>
  <text class="box-title" x="700" y="407" text-anchor="middle">Sensor Search</text>
  <text class="box-text" x="700" y="437" text-anchor="middle">센서 이벤트 CSV</text>
  <text class="small" x="700" y="462" text-anchor="middle">CSV 변환 → Event Text → Embedding</text>
  <text class="small" x="700" y="486" text-anchor="middle">Sensor FAISS Index</text>

  <rect class="purple" x="960" y="370" width="310" height="145" rx="14" stroke-width="2"/>
  <text class="box-title" x="1115" y="407" text-anchor="middle">Wiki Search</text>
  <text class="box-text" x="1115" y="437" text-anchor="middle">Obsidian Wiki</text>
  <text class="small" x="1115" y="462" text-anchor="middle">정비 지식 Markdown → Chunk</text>
  <text class="small" x="1115" y="486" text-anchor="middle">Wiki FAISS Index</text>

  <path class="arrow" d="M1130 291 C1130 330 285 325 285 360"/>
  <path class="arrow" d="M1130 291 C1130 330 700 325 700 360"/>
  <path class="arrow" d="M1130 291 C1130 330 1115 325 1115 360"/>

  <!-- Context and answer -->
  <rect class="gray" x="245" y="575" width="350" height="110" rx="14" stroke-width="2"/>
  <text class="box-title" x="420" y="614" text-anchor="middle">Context 구성</text>
  <text class="box-text" x="420" y="643" text-anchor="middle">관련 매뉴얼 페이지 + 센서 이벤트</text>
  <text class="small" x="420" y="666" text-anchor="middle">Wiki 지식을 하나의 근거 묶음으로 구성</text>

  <rect class="orange" x="685" y="575" width="280" height="110" rx="14" stroke-width="2"/>
  <text class="box-title" x="825" y="614" text-anchor="middle">Ollama Local LLM</text>
  <text class="box-text" x="825" y="643" text-anchor="middle">로컬 답변 생성</text>
  <text class="small" x="825" y="666" text-anchor="middle">검색 근거 기반 한국어 답변</text>

  <rect class="blue" x="1055" y="575" width="230" height="110" rx="14" stroke-width="2"/>
  <text class="box-title" x="1170" y="614" text-anchor="middle">최종 답변</text>
  <text class="box-text" x="1170" y="643" text-anchor="middle">정비 절차 / 주의사항</text>
  <text class="small" x="1170" y="666" text-anchor="middle">출처 및 페이지 포함</text>

  <path class="arrow" d="M285 515 C285 550 420 542 420 565"/>
  <path class="arrow" d="M700 515 C700 550 420 542 420 565"/>
  <path class="arrow" d="M1115 515 C1115 550 420 542 420 565"/>
  <path class="arrow" d="M595 630 L675 630"/>
  <path class="arrow" d="M965 630 L1045 630"/>
  <path class="arrow" d="M1170 575 C1170 530 1255 515 1280 460 C1320 365 1285 245 1255 243"/>

  <!-- Environment panel -->
  <rect class="panel" x="70" y="775" width="1260" height="150"/>
  <text class="section-label" x="100" y="810">개발 및 실행 환경</text>

  <rect class="gray" x="130" y="835" width="310" height="60" rx="12" stroke-width="2"/>
  <text class="box-title" x="285" y="861" text-anchor="middle">Windows 개발 PC</text>
  <text class="small" x="285" y="884" text-anchor="middle">VS Code · GitHub · 데이터 전처리 · 1차 테스트</text>

  <rect class="green" x="545" y="835" width="310" height="60" rx="12" stroke-width="2"/>
  <text class="box-title" x="700" y="861" text-anchor="middle">NVIDIA Jetson Orin Nano</text>
  <text class="small" x="700" y="884" text-anchor="middle">FastAPI Server · Ollama · FAISS · 로컬 배포</text>

  <rect class="blue" x="960" y="835" width="310" height="60" rx="12" stroke-width="2"/>
  <text class="box-title" x="1115" y="861" text-anchor="middle">팀원 PC / 사용자 장치</text>
  <text class="small" x="1115" y="884" text-anchor="middle">Browser · Swagger UI · HTTP API 접속</text>

  <path class="arrow-soft" d="M440 865 L535 865"/>
  <path class="arrow-soft" d="M855 865 L950 865"/>
  <text class="small" x="488" y="846" text-anchor="middle">GitHub / SSH</text>
  <text class="small" x="904" y="846" text-anchor="middle">HTTP API</text>

  <text class="small" x="700" y="955" text-anchor="middle">OceanClaw: 선박 정비 자료를 검색 가능한 지식으로 변환하고, 로컬 LLM으로 근거 기반 답변을 생성하는 Edge AI 시스템</text>
</svg>
